[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai-service"
version = "0.1.0"
description = "ATLAS Python gRPC Service for NLP and Guided AI Consultation"
requires-python = ">=3.11,<3.13"

dependencies = [
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1,<2",
    "protobuf>=7.35.1,<8",
    "pydantic>=2,<3",
    "langchain",
    "langchain-core>=1.8,<2",
    "langchain-google-genai>=4.5,<5",
    "httpx>=0.28,<1",
    "langsmith",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.85.1",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Generated protobuf stubs: never lint or auto-fix (an "unused" import there is
# required to register google/protobuf/timestamp.proto).
extend-exclude = ["src/atlas/ai/v1/ai_pb2.py", "src/atlas/ai/v1/ai_pb2_grpc.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai-service"
version = "0.1.0"
description = "ATLAS Python gRPC Service for NLP and Guided AI Consultation"
requires-python = ">=3.11,<3.13"

dependencies = [
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1,<2",
    "protobuf>=7.35.1,<8",
    "pydantic>=2,<3",
    "langchain",
    "langchain-core>=1.8,<2",
    "langchain-openai==1.7.3",
    "openai>=2.45,<3.42",
    "httpx>=0.28,<1",
    "langsmith",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.85.1",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Generated protobuf stubs: never lint or auto-fix (an "unused" import there is
# required to register google/protobuf/timestamp.proto).
extend-exclude = ["src/atlas/ai/v1/ai_pb2.py", "src/atlas/ai/v1/ai_pb2_grpc.py"]

[tool.uv]
# Reproducible builds: resolve only releases at least ~2 weeks old at lock time.
# langchain-core is exempt because the project already requires >=1.8 (2026-11-11).
exclude-newer = "2026-10-31T00:00:00Z"
exclude-newer-package = { langchain-core = "2026-11-12T00:00:00Z" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai-service"
version = "0.1.0"
description = "ATLAS Python gRPC Service for NLP and Guided AI Consultation"
requires-python = ">=3.11,<3.13"

dependencies = [
    "grpcio>=1.85.1",
    "protobuf>=7.35.1,<8",
    "pydantic>=2,<3",
    "langchain",
    "langchain-core>=1.8,<2",
    "langchain-google-genai>=4.5,<5",
    "httpx>=0.28,<1",
    "langsmith",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.85.1",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

services:
  atlas-ai:
    build:
      context: .
      dockerfile: Dockerfile
      # dev = test/lint tools (used by the test suite); deploy builds the prod target.
      target: ${ATLAS_AI_BUILD_TARGET:-dev}

    image: atlas-ai-service:dev
    container_name: atlas-ai-service

    ports:
      - "127.0.0.1:50051:50051"

    environment:
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      GRPC_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:?GRPC_AUTH_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      CONSULTATION_MODEL: ${CONSULTATION_MODEL:-}
      CONSULTATION_TIMEOUT_SECONDS: ${CONSULTATION_TIMEOUT_SECONDS:-45}
      CONSULTATION_MAX_OUTPUT_TOKENS: ${CONSULTATION_MAX_OUTPUT_TOKENS:-2048}
      CONSULTATION_MAX_CONTEXT_BYTES: ${CONSULTATION_MAX_CONTEXT_BYTES:-120000}
      CONSULTATION_REASONING_EFFORT: ${CONSULTATION_REASONING_EFFORT:-}
      CONSULTATION_PRICE_INPUT_PER_1M_USD: ${CONSULTATION_PRICE_INPUT_PER_1M_USD:-}
      CONSULTATION_PRICE_OUTPUT_PER_1M_USD: ${CONSULTATION_PRICE_OUTPUT_PER_1M_USD:-}
      CONSULTATION_RELEVANCE_CHECK: ${CONSULTATION_RELEVANCE_CHECK:-true}
      CONSULTATION_RELEVANCE_TIMEOUT_SECONDS: ${CONSULTATION_RELEVANCE_TIMEOUT_SECONDS:-10}
      CONSULTATION_SOLUTION_REPAIR: ${CONSULTATION_SOLUTION_REPAIR:-true}
      FEEDBACK_MODEL: ${FEEDBACK_MODEL:-}
      FEEDBACK_EXTRACTION_TIMEOUT_SECONDS: ${FEEDBACK_EXTRACTION_TIMEOUT_SECONDS:-20}
      FEEDBACK_MAX_OUTPUT_TOKENS: ${FEEDBACK_MAX_OUTPUT_TOKENS:-1024}
      FEEDBACK_MAX_CONTEXT_BYTES: ${FEEDBACK_MAX_CONTEXT_BYTES:-32000}
      FEEDBACK_REASONING_EFFORT: ${FEEDBACK_REASONING_EFFORT:-}
      FEEDBACK_PRICE_INPUT_PER_1M_USD: ${FEEDBACK_PRICE_INPUT_PER_1M_USD:-}
      FEEDBACK_PRICE_OUTPUT_PER_1M_USD: ${FEEDBACK_PRICE_OUTPUT_PER_1M_USD:-}
      FEEDBACK_MAX_OPINIONS: ${FEEDBACK_MAX_OPINIONS:-10}
      FEEDBACK_MAX_TEXT_CHARS: ${FEEDBACK_MAX_TEXT_CHARS:-5000}
      FEEDBACK_EMBEDDING_THREADS: ${FEEDBACK_EMBEDDING_THREADS:-2}
      FEEDBACK_MATCH_THRESHOLD: ${FEEDBACK_MATCH_THRESHOLD:-0.85}
      FEEDBACK_MATCH_TOP_K: ${FEEDBACK_MATCH_TOP_K:-3}
      FEEDBACK_MATCH_TIMEOUT_SECONDS: ${FEEDBACK_MATCH_TIMEOUT_SECONDS:-10}
      FEEDBACK_MATCH_JUDGE: ${FEEDBACK_MATCH_JUDGE:-true}
      ATLAS_TRACE_FILE: ${ATLAS_TRACE_FILE:-}
      GRPC_MAX_WORKERS: ${GRPC_MAX_WORKERS:-8}
      GRPC_MAX_CONCURRENT_RPCS: ${GRPC_MAX_CONCURRENT_RPCS:-32}
      GRPC_MAX_MESSAGE_BYTES: ${GRPC_MAX_MESSAGE_BYTES:-4194304}
      GRPC_TLS_CERT_FILE: ${GRPC_TLS_CERT_FILE:-}
      GRPC_TLS_KEY_FILE: ${GRPC_TLS_KEY_FILE:-}
      GRPC_TLS_SERVER_NAME: ${GRPC_TLS_SERVER_NAME:-}
      ORT_DISABLE_TELEMETRY: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"

    # Standard gRPC health check (no token needed; reports readiness only).
    healthcheck:
      test: ["CMD", "python", "-m", "atlas_ai.healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

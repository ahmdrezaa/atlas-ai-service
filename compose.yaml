services:
  atlas-ai:
    build:
      context: .
      dockerfile: Dockerfile

    image: atlas-ai-service:dev
    container_name: atlas-ai-service

    ports:
      - "127.0.0.1:50051:50051"

    environment:
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      GRPC_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:?GRPC_AUTH_TOKEN is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-45}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      CONSULTATION_MAX_CONTEXT_BYTES: ${CONSULTATION_MAX_CONTEXT_BYTES:-120000}
      FEEDBACK_GEMINI_MODEL: ${FEEDBACK_GEMINI_MODEL:-}
      FEEDBACK_GEMINI_API_KEY: ${FEEDBACK_GEMINI_API_KEY:-}
      FEEDBACK_EXTRACTION_TIMEOUT_SECONDS: ${FEEDBACK_EXTRACTION_TIMEOUT_SECONDS:-20}
      FEEDBACK_MAX_OUTPUT_TOKENS: ${FEEDBACK_MAX_OUTPUT_TOKENS:-1024}
      FEEDBACK_MAX_CONTEXT_BYTES: ${FEEDBACK_MAX_CONTEXT_BYTES:-32000}
      FEEDBACK_MAX_OPINIONS: ${FEEDBACK_MAX_OPINIONS:-10}
      FEEDBACK_MAX_TEXT_CHARS: ${FEEDBACK_MAX_TEXT_CHARS:-5000}
      FEEDBACK_EMBEDDING_THREADS: ${FEEDBACK_EMBEDDING_THREADS:-2}
      FEEDBACK_MATCH_THRESHOLD: ${FEEDBACK_MATCH_THRESHOLD:-0.88}
      FEEDBACK_MATCH_TOP_K: ${FEEDBACK_MATCH_TOP_K:-3}
      FEEDBACK_MATCH_TIMEOUT_SECONDS: ${FEEDBACK_MATCH_TIMEOUT_SECONDS:-10}
      FEEDBACK_MATCH_JUDGE: ${FEEDBACK_MATCH_JUDGE:-true}
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"

    # Standard gRPC health check (no token needed; reports readiness only).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc,sys; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; r=g.HealthStub(grpc.insecure_channel('127.0.0.1:50051')).Check(h.HealthCheckRequest(), timeout=3); sys.exit(r.status != h.HealthCheckResponse.SERVING)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
